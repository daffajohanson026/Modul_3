<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Bootstrap - Modul 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff 0%, #f8f9fa 100%);
        }
        main {
            flex: 1;
        }
        .registration-card {
            max-width: 600px;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(13, 110, 253, 0.12);
        }
        footer {
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #dee2e6;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <main class="container d-flex align-items-center py-5">
        <div class="registration-card card w-100 mx-auto">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-5">
                    <span class="badge text-bg-primary mb-2">Modul 2 - Bootstrap</span>
                    <h1 class="h2 fw-bold">Form Registrasi</h1>
                    <p class="text-body-secondary">Silakan lengkapi data diri Anda</p>
                </div>

                <form action="">
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama :</label>
                        <input type="text" class="form-control" id="nama" placeholder="Nama" name="nama" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email :</label>
                        <input type="email" class="form-control" id="email" placeholder="Email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password :</label>
                        <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
                    </div>

                    <div class="mb-4">
                        <label for="jk" class="form-label">Jenis Kelamin :</label>
                        <select class="form-control" id="jk" name="jenis_kelamin" required>
                            <option value="">Pilih Jenis Kelamin</option>
                            <option value="pria">Pria</option>
                            <option value="wanita">Wanita</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="py-3">
        <div class="container text-center text-body-secondary">
            <small><strong>Nama:</strong> Daffa Mirza Johanson &nbsp;|&nbsp; <strong>NIM:</strong> 240211060030</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
