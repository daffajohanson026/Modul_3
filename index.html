<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Form registrasi praktikum Bootstrap">
  <title>Registrasi Praktikum Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff 0%, #f8f9fa 100%);
    }
    .registration-card {
      max-width: 720px;
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(13, 110, 253, .12);
    }
    footer {
      background: rgba(255, 255, 255, .8);
    }
  </style>
</head>
<body class="d-flex flex-column">
  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <section class="registration-card card w-100 mx-auto">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <span class="badge text-bg-primary mb-2">Praktikum Modul 3</span>
          <h1 class="h2 fw-bold">Form Registrasi</h1>
          <p class="text-body-secondary mb-0">Silakan lengkapi data diri Anda.</p>
        </div>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="nama" class="form-label">Nama <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="email" class="form-control" id="email" name="email" placeholder="nama@contoh.com" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password <span class="text-danger" aria-hidden="true">*</span></label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" autocomplete="new-password" minlength="8" required>
            <div class="form-text">Password minimal 8 karakter.</div>
          </div>

          <div class="mb-4">
            <label for="jenis-kelamin" class="form-label">Jenis Kelamin <span class="text-danger" aria-hidden="true">*</span></label>
            <select class="form-select" id="jenis-kelamin" name="jenis_kelamin" required>
              <option value="" selected disabled>Pilih jenis kelamin</option>
              <option value="pria">Pria</option>
              <option value="wanita">Wanita</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="border-top py-3">
    <div class="container text-center text-body-secondary">
      <small>Nama: <strong>Daffa Mirza Johanson</strong> &nbsp;|&nbsp; NIM: <strong>240211060030</strong></small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
